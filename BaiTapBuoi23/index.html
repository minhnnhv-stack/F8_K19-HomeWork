<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FakeStore</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 font-sans text-gray-800">
    <header
      class="w-full h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 sticky top-0 z-50"
    >
      <div class="flex items-center gap-2 text-indigo-600 font-bold text-xl">
        <span class="text-2xl"><i class="fa-solid fa-cart-shopping"></i></span>
        FakeStore
      </div>

      <div class="w-1/3 relative">
        <input
          type="text"
          placeholder="Tìm kiếm sản phẩm..."
          class="w-full px-4 py-2 pl-10 bg-gray-50 border border-gray-200 rounded-full text-sm focus:outline-none focus:border-indigo-500 focus:bg-white transition-colors"
        />
        <span class="absolute left-3 top-2.5 text-gray-400 text-sm"
          ><i class="fa-solid fa-magnifying-glass"></i
        ></span>
      </div>

      <button class="p-2 text-gray-600 hover:text-indigo-600 relative">
        <span class="text-xl"><i class="fa-solid fa-cart-shopping"></i></span>
        <span
          class="absolute top-0 right-0 bg-indigo-600 text-white text-xs w-4 h-4 rounded-full flex items-center justify-center"
          >0</span
        >
      </button>
    </header>

    <div class="max-w-7xl mx-auto px-8 py-8 flex gap-8 flex-col md:flex-row">
      <aside
        class="w-full md:w-64 p-6 bg-white rounded-2xl border border-gray-100 shadow-sm h-fit sticky top-24"
      >
        <h2 class="font-semibold text-gray-800 mb-4 flex items-center gap-2">
          Danh mục
        </h2>

        <ul id="category-list" class="space-y-1"></ul>
      </aside>

      <main class="flex-1">
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-gray-900">Tất cả sản phẩm</h1>
          <p id="product-count" class="text-sm text-gray-500 mt-1">
            Đang tải dữ liệu...
          </p>
        </div>

        <div
          id="product-list"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
        ></div>
      </main>
    </div>
    <script>
      const getProducts = async () => {
        try {
          const response = await fetch("https://fakestoreapi.com/products");
          if (!response.ok) throw new Error("Error HTTP");
          else data = await response.json();
          return data;
        } catch (error) {
          console.error("Error", error);
          return [];
        }
      };
      const renderProducts = (productsData) => {
        const container = document.getElementById("product-list");
        const countText = document.getElementById("product-count");

        countText.innerText = `Hiển thị ${productsData.length} sản phẩm`;

        const htmlString = productsData
          .map((product) => {
            return `
            <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col group">

            <span class="text-xs text-gray-400 capitalize">${product.category}</span>

            <div class="w-full h-48 flex items-center justify-center my-4 p-2 bg-white">
              <img src="${product.image}" alt="${product.title}" class="max-h-full max-w-full object-contain group-hover:scale-110 transition-transform duration-300" />
            </div>

            <h3 class="font-medium text-gray-800 text-sm line-clamp-2 h-10 mb-2 mt-auto">
              ${product.title}
            </h3>

            <div class="flex items-center gap-1 text-xs text-gray-500 mb-4">
              <span class="text-yellow-400"><i class="fa-solid fa-star"></i></span>
              <span class="font-semibold text-gray-700">${product.rating.rate}</span>
              <span>(${product.rating.count} reviews)</span>
            </div>

            <div class="flex items-center justify-between">
              <span class="text-lg font-bold text-indigo-600">$${product.price}</span>
              <button class="p-2.5 bg-gray-900 text-white rounded-xl hover:bg-indigo-600 transition-colors">
                <i class="fa-solid fa-cart-arrow-down"></i>
              </button>
            </div>

          </div>
          `;
          })
          .join("");
        container.innerHTML = htmlString;
      };
      const renderCategories = (productsData) => {
        const categoryList = document.getElementById("category-list");
        const uniqueCategories = [
          ...new Set(productsData.map((product) => product.category)),
        ];
        console.log(uniqueCategories);
        let htmlString = `
          <li>
            <button class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm bg-indigo-50 text-indigo-600 font-medium">
              <span>Tất cả sản phẩm</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-200 text-indigo-700">${productsData.length}</span>
            </button>
          </li>
        `;
        htmlString += uniqueCategories
          .map((category) => {
            const count = productsData.filter(
              (product) => product.category === category,
            ).length;

            return `
            <li>
              <button class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm text-gray-600 hover:bg-gray-50 capitalize transition-colors">
                <span>${category}</span>
                <span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">${count}</span>
              </button>
            </li>
          `;
          })
          .join("");
        categoryList.innerHTML = htmlString;
      };

      const initApp = async () => {
        const products = await getProducts();

        if (products.length > 0) {
          renderProducts(products);
          renderCategories(products);
        } else {
          document.getElementById("product-list").innerHTML =
            "<p class='col-span-full text-center text-gray-500 py-10'>Không có sản phẩm nào để hiển thị.</p>";
        }
      };

      initApp();
    </script>
  </body>
</html>
