<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="min-h-screen bg-gray-50 p-8">
      <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-3xl font-bold mb-4">Thông tin hồ sơ</h1>

        <!-- Phần hiển thị thông tin -->
        <div id="profileContent" class="space-y-4">
          <div id="userInfo">
            <img
              id="userImage"
              class="w-32 h-32 rounded-full mb-4"
              src=""
              alt="Avatar"
            />
            <p><strong>ID:</strong> <span id="userId"></span></p>
            <p><strong>Username:</strong> <span id="username"></span></p>
            <p><strong>firstName:</strong> <span id="firstName"></span></p>
            <p><strong>lastName:</strong> <span id="lastName"></span></p>

            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>Giới tính:</strong> <span id="gender"></span></p>
          </div>
        </div>

        <button id="logoutBtn" class="mt-6 text-red-500 hover:underline">
          Đăng xuất
        </button>
      </div>
    </div>
  </body>
  <script src="profile.js"></script>
</html>
